name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    # tests/authSession.test.ts runs against a real PostgreSQL (no FakePool) —
    # it exercises the user_sessions rows behind the refresh flow. Without a
    # database the whole suite dies on ECONNREFUSED, so the service below is
    # not optional: it is what makes `npm test` able to reach the last file.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: endpointx
          POSTGRES_PASSWORD: endpointx_secret
          POSTGRES_DB: endpointx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: endpointx
      DB_USER: endpointx
      DB_PASSWORD: endpointx_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
