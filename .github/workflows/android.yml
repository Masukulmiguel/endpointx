name: android-agent

on:
  push:
    paths:
      - 'endpoint-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Restore signing keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p endpoint-android/keystore
            echo "$KEYSTORE_B64" | base64 -d > endpoint-android/keystore/endpointx.jks
            cat > endpoint-android/keystore.properties <<EOF
          storeFile=keystore/endpointx.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi

      - name: Build APK
        run: gradle -p endpoint-android assembleRelease --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: endpointx-agent
          path: endpoint-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
