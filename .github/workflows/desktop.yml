name: desktop-installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'endpoint-desktop/**'

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: endpoint-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build NSIS installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EndpointX-HERMES-Setup
          path: endpoint-desktop/dist/*.exe
          if-no-files-found: error
