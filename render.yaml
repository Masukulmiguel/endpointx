services:
  - type: web
    name: endpointx
    runtime: node
    plan: free
    buildCommand: cd backend-api && npm install
    startCommand: cd backend-api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: AGENT_SECRET
        value: dev_agent_secret_123
    healthCheckPath: /health
