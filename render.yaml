services:
  - type: web
    name: endpointx-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend-api/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: AGENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://endpointx-dashboard.onrender.com
      - key: OFFLINE_THRESHOLD
        value: "300"
      - key: MOBILE_OFFLINE_THRESHOLD
        value: "1800"
      - key: OPENCODE_SERVER_URL
        sync: false
      - key: OPENCODE_SERVER_USERNAME
        value: opencode
      - key: OPENCODE_SERVER_PASSWORD
        sync: false
      - key: OPENCODE_MODEL
        sync: false
      - key: OPENCODE_TIMEOUT_MS
        value: "60000"
      - key: OPENCODE_ZEN_API_KEY
        sync: false
      - key: OPENCODE_ZEN_MODEL
        value: mimo-v2.6-flash-free
      - key: OPENCODE_ZEN_BASE_URL
        value: https://opencode.ai/zen/v1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: DB_HOST
        fromDatabase:
          name: endpointx-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: endpointx-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: endpointx-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: endpointx-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: endpointx-db
          property: password
      # External analysis engine (Cyber Lab). The package and its expected
      # checksum are operator-supplied and live in the Render dashboard —
      # their values never enter the repository. With them unset the boot
      # hook installs nothing and the subsystem reports "not configured".
      - key: SEEFAST_ENGINE_PKG
        sync: false
      - key: SEEFAST_ENGINE_PKG_SHA256
        sync: false
      - key: SEEFAST_CLI
        sync: false
    healthCheckPath: /health

  - type: web
    name: endpointx-dashboard
    runtime: static
    buildCommand: cd admin-dashboard && npm install && npm run build
    staticPublishPath: admin-dashboard/dist
    envVars:
      - key: NODE_ENV
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: postgres
    name: endpointx-db
    plan: free
    databaseName: endpointx
