services:
  - type: web
    name: endpointx-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend-api/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: AGENT_SECRET
        value: dev_agent_secret_123
    healthCheckPath: /health

  - type: web
    name: endpointx-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./admin-dashboard/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
