services:
  - type: web
    name: endpointx
    runtime: docker
    plan: free
    dockerfilePath: ./backend-api/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: AGENT_SECRET
        value: dev_agent_secret_123
    healthCheckPath: /health
