version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: endpointx-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-endpointx}
      POSTGRES_USER: ${POSTGRES_USER:-endpointx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-endpointx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: endpointx-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-endpointx}
      DB_USER: ${POSTGRES_USER:-endpointx}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      JWT_SECRET: ${JWT_SECRET:-generate_a_strong_secret_here}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-generate_another_strong_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      AGENT_SECRET: ${AGENT_SECRET:-change_agent_secret_min_32_chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: endpointx-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
