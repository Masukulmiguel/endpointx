<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-title="forgot.title">Recuperar palavra-passe · EndpointX</title>
    <meta name="description" content="Recupere o acesso à sua conta EndpointX." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <script>
      try {
        var p = localStorage.getItem('endpointx_theme') || 'system';
        var d = p === 'light' || p === 'dark' ? p : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', d);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <script type="module" crossorigin src="/assets/i18n-CTGNOt1p.js"></script>
    <script type="module" crossorigin src="/assets/auth-B6RgFYHZ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/i18n-Cz1YAKC5.css">
  </head>
  <body>
    <div class="auth-page">
      <div class="grid-motif" aria-hidden="true"></div>
      <div class="glow glow-cyan" style="width: 460px; height: 460px; bottom: -180px; right: -120px" aria-hidden="true"></div>
      <div class="auth-card">
        <a class="brand" href="/">
          <img src="/icon.png" alt="" width="30" height="30" />
          <span>Endpoint<span class="x">X</span></span>
        </a>
        <h1 data-i18n="forgot.title">Recuperar palavra-passe</h1>
        <p class="auth-sub" data-i18n="forgot.sub">Enviaremos um link de recuperação para o seu email.</p>

        <div class="auth-controls">
          <div class="lang-switch" role="group" aria-label="Idioma">
            <button type="button" data-lang-btn="pt">PT</button>
            <button type="button" data-lang-btn="en">EN</button>
          </div>
          <button type="button" class="icon-btn" data-theme-btn="system" aria-label="Alternar tema">◐</button>
        </div>

        <div id="auth-alert" class="alert alert-error" hidden></div>

        <form id="forgot-form" class="form-stack" novalidate>
          <div class="field">
            <label for="email" data-i18n="forgot.email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required data-i18n-placeholder="forgot.email" placeholder="Email" />
          </div>
          <button id="forgot-submit" class="btn btn-primary btn-block" type="submit" data-i18n="forgot.submit">Enviar link</button>
        </form>

        <p class="auth-meta">
          <a href="/login" data-i18n="forgot.back">← Voltar ao início</a>
        </p>
      </div>
    </div>
  </body>
</html>
