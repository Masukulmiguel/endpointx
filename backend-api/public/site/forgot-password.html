<!DOCTYPE html>
<html lang="pt" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar palavra-passe · EndpointX</title>
    <meta name="description" content="Recupere o acesso à sua conta EndpointX." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/logotipo-fundo-branco.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <a class="brand" href="/">
          <img src="/logotipo-fundo-escuro.png" alt="EndpointX" class="logo-dark" width="36" height="36" />
          <img src="/logotipo-fundo-branco.png" alt="EndpointX" class="logo-light" width="36" height="36" />
          <span>EndpointX</span>
        </a>
        <h1 data-i18n="forgot.title">Recuperar palavra-passe</h1>
        <p class="auth-sub" data-i18n="forgot.sub">Enviaremos um link de redefinição se a conta existir.</p>

        <div class="lang-switch" style="justify-content: center; margin-bottom: 1.1rem" role="group" aria-label="Language">
          <button type="button" data-lang-btn="pt">PT</button>
          <button type="button" data-lang-btn="en">EN</button>
        </div>
        <div style="display: flex; justify-content: center; margin-bottom: 1.25rem">
          <button type="button" class="icon-btn" data-theme-btn="system" aria-label="Theme" aria-pressed="true">◐</button>
        </div>

        <div id="auth-alert" class="alert" hidden></div>

        <form id="forgot-form" class="form-stack" novalidate>
          <div class="field">
            <label for="email" data-i18n="forgot.email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <button id="forgot-submit" class="btn btn-primary btn-block" type="submit" data-i18n="forgot.submit">Enviar link</button>
        </form>

        <p class="auth-meta">
          <a href="/login.html" data-i18n="forgot.backLogin">Voltar a entrar</a>
        </p>
        <p class="auth-meta">
          <a href="/" data-i18n="login.back">← Voltar ao início</a>
        </p>
      </div>
    </div>
    <script src="/js/i18n.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
