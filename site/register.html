<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-title="register.title">Criar conta · EndpointX</title>
    <meta name="description" content="Crie a sua conta EndpointX e comece o early access gratuito." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <script>
      try {
        var p = localStorage.getItem('endpointx_theme') || 'system';
        var d = p === 'light' || p === 'dark' ? p : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', d);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="grid-motif" aria-hidden="true"></div>
      <div class="glow glow-cyan" style="width: 460px; height: 460px; top: -160px; left: -120px" aria-hidden="true"></div>
      <div class="auth-card">
        <a class="brand" href="/">
          <img src="/icon.png" alt="" width="30" height="30" />
          <span>Endpoint<span class="x">X</span></span>
        </a>
        <h1 data-i18n="register.title">Criar conta</h1>
        <p class="auth-sub" data-i18n="register.sub">Comece o early access gratuito do EndpointX.</p>

        <div class="auth-controls">
          <div class="lang-switch" role="group" aria-label="Idioma">
            <button type="button" data-lang-btn="pt">PT</button>
            <button type="button" data-lang-btn="en">EN</button>
          </div>
          <button type="button" class="icon-btn" data-theme-btn="system" aria-label="Alternar tema">◐</button>
        </div>

        <div id="auth-alert" class="alert alert-error" hidden></div>

        <form id="register-form" class="form-stack" novalidate>
          <div class="field">
            <label for="full_name" data-i18n="register.name">Nome completo</label>
            <input
              id="full_name"
              name="full_name"
              type="text"
              autocomplete="name"
              required
              data-i18n-placeholder="register.name"
              placeholder="Nome completo"
            />
          </div>
          <div class="field">
            <label for="email" data-i18n="register.email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required data-i18n-placeholder="register.email" placeholder="Email" />
          </div>
          <div class="field">
            <label for="password" data-i18n="register.password">Palavra-passe</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              minlength="12"
              data-i18n-placeholder="register.password"
              placeholder="Palavra-passe"
            />
            <p class="field-hint">12+ caracteres · maiúscula · minúscula · número · símbolo</p>
          </div>
          <button id="register-submit" class="btn btn-primary btn-block" type="submit" data-i18n="register.submit">Criar conta</button>
        </form>

        <p class="auth-meta">
          <span data-i18n="register.haveAccount">Já tem conta?</span>
          <a href="/login" data-i18n="nav.login">Entrar</a>
        </p>
        <p class="auth-meta">
          <a href="/" data-i18n="register.back">← Voltar ao início</a>
        </p>
      </div>
    </div>
    <script type="module" src="/src/js/i18n.js"></script>
    <script type="module" src="/src/js/auth.js"></script>
  </body>
</html>
